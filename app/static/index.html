<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Printdash</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v5H7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><rect x="3" y="8" width="18" height="9" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7 14h10v7H7z" fill="var(--surface)" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="17.5" cy="11.2" r="1" fill="currentColor"/></svg>
      <span>Printdash</span>
      <span id="mock-badge" class="badge badge-mock" hidden>Mock mode</span>
    </div>
    <div class="conn" id="conn" data-state="connecting">
      <span class="dot"></span><span id="conn-text">Connecting…</span>
    </div>
  </header>

  <main class="layout">
    <section class="col-main">
      <div class="section-head">
        <h2>Printers</h2>
      </div>
      <div id="printers" class="printers" aria-live="polite">
        <div class="skeleton card"></div>
      </div>

      <div class="section-head">
        <h2>Queue</h2>
        <div class="tabs" role="tablist">
          <button role="tab" class="tab" data-which="not-completed" aria-selected="true">Active <span class="count" id="active-count"></span></button>
          <button role="tab" class="tab" data-which="completed" aria-selected="false">History</button>
        </div>
      </div>
      <div id="jobs" class="card jobs"></div>
    </section>

    <aside class="col-side">
      <form id="print-form" class="card print-card">
        <h2>Print</h2>
        <label class="drop" id="drop">
          <input type="file" id="file" name="file" accept=".pdf,.ps,.txt,.png,.jpg,.jpeg" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4m0 0L8 8m4-4 4 4M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="drop-title" id="drop-title">Drop a file here</span>
          <span class="drop-sub" id="drop-sub">or click to choose · PDF, image or text</span>
        </label>

        <div class="field">
          <label for="printer-select">Printer</label>
          <select id="printer-select" name="printer" required></select>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="copies">Copies</label>
            <div class="stepper">
              <button type="button" data-step="-1" aria-label="Fewer">−</button>
              <input id="copies" name="copies" type="number" min="1" max="99" value="1" inputmode="numeric">
              <button type="button" data-step="1" aria-label="More">+</button>
            </div>
          </div>
          <div class="field">
            <label for="page-ranges">Pages</label>
            <input id="page-ranges" name="page_ranges" placeholder="All, e.g. 1-3,5" autocomplete="off">
          </div>
        </div>
        <label class="check">
          <input type="checkbox" name="fit_to_page" value="true">
          <span>Fit to page</span>
        </label>
        <button type="submit" class="btn btn-primary btn-block" id="print-btn" disabled>Print</button>
      </form>
    </aside>
  </main>

  <div id="toasts" class="toasts" aria-live="assertive"></div>

  <template id="printer-tpl">
    <article class="card printer">
      <div class="printer-top">
        <div class="printer-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M7 3h10v5H7z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><rect x="3" y="8" width="18" height="9" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7 14h10v7H7z" fill="var(--surface-2)" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </div>
        <div class="printer-title">
          <h3><span class="p-name"></span> <span class="badge p-default" hidden>Default</span></h3>
          <p class="muted p-sub"></p>
        </div>
        <span class="pill p-state"></span>
      </div>
      <p class="p-message"></p>
      <div class="printer-foot">
        <span class="muted p-queue"></span>
        <div class="actions">
          <button class="btn btn-ghost" data-act="toggle"></button>
          <button class="btn btn-ghost" data-act="testpage">Test page</button>
          <details class="menu">
            <summary class="btn btn-ghost btn-icon" aria-label="More options">⋯</summary>
            <div class="menu-pop">
              <button data-act="default">Make default</button>
              <button data-act="cancel-all" class="danger">Clear queue</button>
            </div>
          </details>
        </div>
      </div>
    </article>
  </template>
</body>
</html>
